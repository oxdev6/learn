<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="#EBF8FF" stroke="#63B3ED" stroke-width="2"/>
  <!-- Volatility line -->
  <polyline points="20,120 60,80 100,130 140,70 180,110" fill="none" stroke="#2B6CB0" stroke-width="4"/>
  <!-- Volatility peaks -->
  <circle cx="60" cy="80" r="5" fill="#2B6CB0"/>
  <circle cx="100" cy="130" r="5" fill="#2B6CB0"/>
  <circle cx="140" cy="70" r="5" fill="#2B6CB0"/>
  <!-- Label -->
  <text x="100" y="175" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#2C5282">Volatility</text>
</svg>