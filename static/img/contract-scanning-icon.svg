<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="#F0FDF4" stroke="#34D399" stroke-width="2"/>
  <!-- Magnifying glass -->
  <circle cx="80" cy="80" r="30" fill="#10B981"/>
  <rect x="100" y="100" width="40" height="8" transform="rotate(45 100 100)" fill="#10B981"/>
  <!-- Code brackets -->
  <text x="80" y="85" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#FFFFFF">&lt;/&gt;</text>
  <!-- Label -->
  <text x="100" y="180" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#047857">Scan Code</text>
</svg>